name: Wiki

# Publishes docs/wiki/ to the GitHub wiki, which is its own git repository.
# The wiki must exist first: create any page in the wiki UI once.
on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Push docs/wiki to the wiki repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          # Replace everything except the wiki's .git with docs/wiki/.
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R docs/wiki/. wiki/
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push
