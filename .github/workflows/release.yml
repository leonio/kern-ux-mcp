name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run — build and compute version without publishing'
        required: false
        default: false
        type: boolean
      publish_environment:
        description: 'GitHub environment used to approve publishing'
        required: false
        default: 'release'
        type: string

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      packageFile: ${{ steps.pack.outputs.package_file }}
      preReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}
      npmDistTag: ${{ steps.npm-dist-tag.outputs.npmDistTag }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Compute Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Compute npm dist-tag
        id: npm-dist-tag
        shell: bash
        env:
          PRE_RELEASE_LABEL: ${{ steps.gitversion.outputs.preReleaseLabel }}
        run: |
          if [[ -z "$PRE_RELEASE_LABEL" ]]; then
            echo "npmDistTag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "npmDistTag=${PRE_RELEASE_LABEL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show Computed Version
        run: |
          echo "SemVer:     ${{ steps.gitversion.outputs.semVer }}"
          echo "NuGetVer:   ${{ steps.gitversion.outputs.nuGetVersion }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Build (CI — uses checked-in registry.json)
        run: npm run build:ci

      - name: Run Tests
        run: npm test

      - name: Inject Version into package.json
        run: npm pkg set version="${{ steps.gitversion.outputs.semVer }}"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Pack Release Tarball
        id: pack
        shell: bash
        run: |
          package_file="$(npm pack)"
          echo "package_file=${package_file}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes Preview
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${{ steps.gitversion.outputs.semVer }}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f configuration_file_path=".github/release.yml" \
            > release-notes-preview.json

          {
            jq -r '.name' release-notes-preview.json
            echo
            jq -r '.body' release-notes-preview.json
          } > release-notes-preview.md

          {
            echo '## Release Notes Preview'
            echo
            cat release-notes-preview.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ${{ steps.pack.outputs.package_file }}
            sbom.cyclonedx.json

      - name: Upload Release Notes Preview
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-preview
          if-no-files-found: ignore
          path: |
            release-notes-preview.md
            release-notes-preview.json

  publish:
    name: Publish Release
    if: ${{ !inputs.dry-run }}
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.publish_environment }}
    permissions:
      contents: write   # create GitHub releases and tags
      packages: write   # publish to GitHub Packages
      id-token: write   # npm trusted publishing via GitHub OIDC

    steps:
      - name: Download Release Artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: release-assets
          path: release-package

      - name: Setup Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm (trusted publishing)
        run: npm publish "./release-package/${{ needs.verify.outputs.packageFile }}" --provenance --access public --tag ${{ needs.verify.outputs.npmDistTag }}

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@leonio'

      - name: Publish to GitHub Packages
        run: npm publish "./release-package/${{ needs.verify.outputs.packageFile }}" --tag ${{ needs.verify.outputs.npmDistTag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE_RELEASE_LABEL: ${{ needs.verify.outputs.preReleaseLabel }}
        shell: bash
        run: |
          prerelease_flag=""
          if [[ -n "$PRE_RELEASE_LABEL" ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "v${{ needs.verify.outputs.semVer }}" \
            "release-package/${{ needs.verify.outputs.packageFile }}" \
            "release-package/sbom.cyclonedx.json" \
            --title "v${{ needs.verify.outputs.semVer }}" \
            --generate-notes \
            $prerelease_flag