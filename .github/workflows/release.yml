name: Release

# Publishes @leonio/kern-ux-mcp (npm, GitHub Packages, .mcpb on the GitHub
# release) and @leonio/kern-ux-mcp-http (npm, GitHub Packages, GHCR image).
# @leonio/kern-ux-core is private: it's inlined into both and never published.
#
# Two approvals: the `release` environment starts the publish job, and each npm
# version is only staged (npm stage publish) until a maintainer approves it on
# npmjs.com with 2FA. The job waits for that approval before anything else goes
# out. Every publish step skips what already exists, so a re-run after a partial
# failure finishes the release. One-time setup for a new package: CONTRIBUTING.md (Releasing).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run — build, test and pack without publishing'
        required: false
        default: false
        type: boolean
      publish_environment:
        description: 'GitHub environment used to approve publishing'
        required: false
        default: 'release'
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      preReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}
      npmDistTag: ${{ steps.npm-dist-tag.outputs.npmDistTag }}
    permissions:
      contents: write   # the release notes preview API

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'

      - name: Compute Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Compute npm dist-tag
        id: npm-dist-tag
        shell: bash
        env:
          PRE_RELEASE_LABEL: ${{ steps.gitversion.outputs.preReleaseLabel }}
        run: |
          if [[ -z "$PRE_RELEASE_LABEL" ]]; then
            echo "npmDistTag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "npmDistTag=${PRE_RELEASE_LABEL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show Computed Version
        run: |
          echo "SemVer:     ${{ steps.gitversion.outputs.semVer }}"
          echo "NuGetVer:   ${{ steps.gitversion.outputs.nuGetVersion }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "npm dist-tag: ${{ steps.npm-dist-tag.outputs.npmDistTag }}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Before the build: the bundles inline the version the servers report.
      # All workspaces move in lockstep, the private core included.
      - name: Set the Version
        run: npm pkg set version="${{ steps.gitversion.outputs.semVer }}" --workspaces

      - name: Build (uses the checked-in registry.json)
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Run E2E Tests
        run: npm run test:e2e

      # One CycloneDX SBOM per published package; each ships in its tarball.
      - name: Generate SBOMs
        run: npm run sbom

      - name: Pack the Release Assets
        shell: bash
        env:
          SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: |
          mkdir -p release-assets
          npm pack -w packages/stdio -w packages/http --pack-destination release-assets
          npm run pack:mcpb -w packages/stdio
          cp packages/stdio/mcpb-dist/*.mcpb release-assets/
          cp packages/stdio/sbom.cyclonedx.json "release-assets/kern-ux-mcp-${SEMVER}.cdx.json"
          cp packages/http/sbom.cyclonedx.json "release-assets/kern-ux-mcp-http-${SEMVER}.cdx.json"
          ls -l release-assets

      - name: Generate Release Notes Preview
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${{ steps.gitversion.outputs.semVer }}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f configuration_file_path=".github/release.yml" \
            > release-notes-preview.json

          {
            jq -r '.name' release-notes-preview.json
            echo
            jq -r '.body' release-notes-preview.json
          } > release-notes-preview.md

          {
            echo '## Release Notes Preview'
            echo
            cat release-notes-preview.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release Assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

      - name: Upload Release Notes Preview
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-preview
          if-no-files-found: ignore
          path: |
            release-notes-preview.md
            release-notes-preview.json

  publish:
    name: Publish Release
    if: ${{ !inputs.dry-run }}
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.publish_environment }}
    permissions:
      contents: write      # create the GitHub release and tag
      packages: write      # GitHub Packages and GHCR
      id-token: write      # npm trusted publishing and attestations (GitHub OIDC)
      attestations: write  # provenance and SBOM attestations
    env:
      SEMVER: ${{ needs.verify.outputs.semVer }}
      DIST_TAG: ${{ needs.verify.outputs.npmDistTag }}
      IMAGE: ghcr.io/leonio/kern-ux-mcp-http

    steps:
      # The image is built from source, like CI; everything else comes from verify.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Release Assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Setup Node for npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm Supports Staged Publishing
        run: |
          node -e '
            const version = process.argv[1];
            const [major, minor] = version.split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 15)) {
              console.error(`npm ${version} is too old: npm stage publish needs 11.15.0 or later.`);
              process.exit(1);
            }
            console.log(`npm ${version}`);
          ' "$(npm --version)"

      # Trusted publishing (OIDC), staged: nothing is live until approved with 2FA.
      # Only the stdio and http tarballs are in release-assets; core is never packed.
      # The ./ matters: npm reads "release-assets/x.tgz" as a GitHub repo shorthand.
      - name: Stage on npm
        shell: bash
        run: |
          {
            echo "## Approve the npm release"
            echo
            echo "Approve each staged version with 2FA: npmjs.com → **Staged Packages** → **Approve**,"
            echo "or \`npm stage list <package>\` and \`npm stage approve <stage-id>\`. This job waits for it."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for tarball in ./release-assets/*.tgz; do
            name="$(tar -xOzf "$tarball" package/package.json | jq -r .name)"
            if [[ -n "$(npm view "$name@$SEMVER" version 2>/dev/null)" ]]; then
              echo "$name@$SEMVER is already live on npm; skipping."
              continue
            fi
            if ! npm stage publish "$tarball" --provenance --access public --tag "$DIST_TAG"; then
              echo "::error::Staging $name@$SEMVER failed. If an earlier attempt already staged it, approve (or reject) it on npmjs.com, then re-run the failed job."
              exit 1
            fi
            echo "- \`$name@$SEMVER\` (tag \`$DIST_TAG\`)" >> "$GITHUB_STEP_SUMMARY"
          done

      # GitHub Packages, the image and the GitHub release only go out once npm
      # has the approved versions. If approval takes longer, this step times out;
      # approve, then re-run the failed job: live versions are skipped.
      - name: Wait for Approval on npmjs.com
        timeout-minutes: 60
        shell: bash
        run: |
          for tarball in ./release-assets/*.tgz; do
            name="$(tar -xOzf "$tarball" package/package.json | jq -r .name)"
            until [[ -n "$(npm view "$name@$SEMVER" version --prefer-online 2>/dev/null)" ]]; do
              echo "Waiting for $name@$SEMVER to be approved and live on npm…"
              sleep 30
            done
            echo "$name@$SEMVER is live."
          done

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@leonio'

      - name: Publish to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tarball in ./release-assets/*.tgz; do
            name="$(tar -xOzf "$tarball" package/package.json | jq -r .name)"
            if [[ -n "$(npm view "$name@$SEMVER" version 2>/dev/null)" ]]; then
              echo "$name@$SEMVER is already on GitHub Packages; skipping."
            else
              npm publish "$tarball" --tag "$DIST_TAG"
            fi
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an Existing Image
        id: image
        run: |
          if docker buildx imagetools inspect "$IMAGE:$SEMVER" > /dev/null 2>&1; then
            echo "$IMAGE:$SEMVER already exists; skipping the push."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # BuildKit's own attestations are off: its SBOM scanner can't see packages
      # inlined into the bundle. The GitHub attestations below (verifiable with
      # `gh attestation verify`) carry the npm SBOM of the http package instead.
      - name: Build and Push the Image
        id: push
        if: ${{ steps.image.outputs.exists == 'false' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/http/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.SEMVER }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SEMVER }}
            ${{ env.IMAGE }}:${{ env.DIST_TAG }}
          provenance: false
          sbom: false

      # The attestations run on every attempt, against the pushed digest or, when
      # an earlier attempt pushed the image, the existing one, so a re-run fills
      # in any that failed. Attesting a digest twice is harmless.
      - name: Resolve the Image Digest
        id: digest
        env:
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          digest="${PUSHED_DIGEST:-$(docker buildx imagetools inspect "$IMAGE:$SEMVER" --format '{{.Manifest.Digest}}')}"
          echo "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest Image Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest Image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: release-assets/kern-ux-mcp-http-${{ env.SEMVER }}.cdx.json
          push-to-registry: true

      - name: Attest MCP Bundle Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*.mcpb

      - name: Attest MCP Bundle SBOM
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*.mcpb
          sbom-path: release-assets/kern-ux-mcp-${{ env.SEMVER }}.cdx.json

      # --target pins the tag to the released commit; without it gh tags the
      # default branch, which is wrong for pre-releases from feat/v2-alpha.
      - name: Create or Update the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE_RELEASE_LABEL: ${{ needs.verify.outputs.preReleaseLabel }}
        shell: bash
        run: |
          tag="v$SEMVER"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            prerelease_flag=""
            if [[ -n "$PRE_RELEASE_LABEL" ]]; then
              prerelease_flag="--prerelease"
            fi
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes \
              $prerelease_flag
          fi
