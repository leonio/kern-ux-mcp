version: 2
routes:
  knowledge_only:
    triggers:
      - knowledge/
      - packages/core/src/ux/knowledge-map.ts
      - packages/core/src/ux/knowledge-import.ts
      - packages/core/src/ux/knowledge-projection.ts
      - tools/knowledge
    primary_owner: the knowledge import and the code-owned ID map
    follow_up:
      - knowledge-import
      - focused-knowledge-tests
  tool_notes_only:
    triggers:
      - packages/core/src/ux/tool-notes.ts
    primary_owner: notes about our tools (where a tool deliberately differs from KERN)
    follow_up:
      - nearest-focused-tests
  runtime_only:
    triggers:
      - packages/core/src/ux/schemas
      - packages/core/src/ux/templates
      - packages/core/src/ux/tool-builders
      - packages/core/src/ux/tools.ts
    primary_owner: runtime schema/template/tool surfaces
    follow_up:
      - nearest-focused-tests
      - typecheck-if-needed
  mixed:
    triggers:
      - runtime change plus a knowledge map or registry contract change
    primary_owner: start at the closest behavior owner, then the map or the projection if what the registry carries changed
    follow_up:
      - nearest-focused-tests
      - knowledge-import
      - focused-knowledge-tests
