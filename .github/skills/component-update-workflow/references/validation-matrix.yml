version: 2
scenarios:
  knowledge_only:
    commands:
      - npm run knowledge:import -- <bundle-dir> --dry-run   # a new bundle: check it and see what changes
      - npm run knowledge:import -- <bundle-dir>             # then import it
      - npm run knowledge:import                             # a map change only: regenerate registry.json from knowledge/
      - npm test -- packages/core/src/ux/knowledge tools/knowledge packages/core/src/ux/tools.behaviour.test.ts packages/core/src/ux/tools.listing.test.ts
  tool_notes_only:
    commands:
      - npm test -- packages/core/src/ux/tools.behaviour.test.ts
  runtime_only:
    commands:
      - nearest-focused-test-command
      - npx tsc --noEmit
  mixed:
    commands:
      - nearest-focused-test-command
      - npm run knowledge:import
      - npm test -- packages/core/src/ux/knowledge tools/knowledge packages/core/src/ux/tools.behaviour.test.ts packages/core/src/ux/tools.listing.test.ts
      - npx tsc --noEmit
principles:
  - Start with the cheapest behavior-scoped check.
  - Use typecheck when no narrower executable check exists or after mixed changes.
  - Do not use git diff as the only validation when an executable check is available.
